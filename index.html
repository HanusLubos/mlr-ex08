<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leaf classifier</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10140f">
<style>
  :root{
    --bg:#10140f; --panel:#1a211a; --line:#2c362b; --ink:#eaf2e6;
    --dim:#93a58e; --bar:#3d4d3a; --accent:#8ede7a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
    max-width:520px; margin-inline:auto;
  }
  h1{font-size:19px; margin:0 0 2px; letter-spacing:.2px}
  .sub{color:var(--dim); font-size:13px; margin:0 0 14px}

  /* Square frame == exactly the central square the model sees (object-fit:cover
     crops symmetrically about the centre, same as the JS crop). */
  .frame{
    position:relative; width:100%; aspect-ratio:1/1; background:#000;
    border:1px solid var(--line); border-radius:14px; overflow:hidden;
  }
  .frame video, .frame canvas.freeze{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
  }
  .hint{
    position:absolute; inset:0; display:grid; place-items:center; padding:24px;
    text-align:center; color:var(--dim); font-size:14px;
  }
  .fdot{
    position:absolute; top:10px; left:10px; font-size:11px; letter-spacing:.4px;
    background:rgba(0,0,0,.55); padding:3px 8px; border-radius:99px; color:#fff;
  }

  .row{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0}
  button, label.btn{
    flex:1 1 auto; appearance:none; border:1px solid var(--line); border-radius:11px;
    background:var(--panel); color:var(--ink); font:inherit; font-size:15px;
    padding:11px 14px; text-align:center; cursor:pointer; user-select:none;
  }
  button:active, label.btn:active{transform:translateY(1px)}
  button[data-on="1"]{background:var(--accent); color:#0d130c; border-color:var(--accent); font-weight:600}
  button:disabled{opacity:.45; cursor:default}
  input[type=file]{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:12px}
  .top{display:flex; align-items:baseline; gap:8px; margin-bottom:10px}
  .top b{font-size:22px} .top span{color:var(--dim); font-size:12px; margin-left:auto}

  .cls{display:grid; grid-template-columns:74px 1fr 78px; align-items:center; gap:9px; margin:7px 0}
  .cls .n{font-size:14px}
  .cls .p{font-size:13px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums}
  .cls.win .n,.cls.win .p{color:var(--accent); font-weight:650}
  .track{height:9px; background:var(--bar); border-radius:99px; overflow:hidden}
  .fill{height:100%; width:0; background:var(--accent); border-radius:99px;
        transition:width .12s linear}

  .cmp{display:flex; align-items:center; gap:10px; margin-top:12px; color:var(--dim); font-size:12px}
  .cmp canvas{width:76px; height:76px; border-radius:8px; background:#000;
              image-rendering:pixelated; border:1px solid var(--line)}

  #log{white-space:pre-wrap; font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
       color:var(--dim); margin:8px 0 0; word-break:break-word}
  #log .ok{color:var(--accent)} #log .bad{color:#ff9a8a}
  a{color:var(--accent)}
</style>
</head>
<body>

<h1>Leaf classifier</h1>
<p class="sub">Central-square crop → 96×96 → RGB÷255 → per-channel mean/std → <span id="modelTag">leaf_model.onnx</span></p>

<div class="frame">
  <!-- playsinline is mandatory: without it Safari on iPhone hijacks play() into fullscreen. -->
  <video id="video" playsinline muted autoplay></video>
  <canvas id="freeze" class="freeze" hidden></canvas>
  <div class="fdot" id="stateDot" hidden>live</div>
  <div class="hint" id="hint">Point the rear camera at a leaf.</div>
</div>

<div class="row">
  <button id="btnCam">Start camera</button>
  <button id="btnRot">Frame: auto</button>
  <label class="btn" for="file">Photo</label>
  <input type="file" id="file" accept="image/*">
</div>

<div class="panel">
  <div class="top"><b id="top">—</b><span id="fps"></span></div>
  <div id="bars"></div>
  <div class="cmp">
    <canvas id="thumb" width="96" height="96"></canvas>
    <span>exactly what the model sees</span>
  </div>
</div>

<div class="panel">
  <div class="row" style="margin:0">
    <button id="btnCheck">Run self-test</button>
  </div>
  <pre id="log">idle</pre>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.min.js"
        onerror="window.__ortLoadFailed=1"></script>
<script>
"use strict";
(function () {
  // ---- Configuration -------------------------------------------------------
  // Mirrors model_info.json; the file is re-fetched at startup and wins if present.
  var CFG = { classes:["apple","cherry","chestnut","maple"], input_size:96,
              mean:[0.485,0.456,0.406], std:[0.229,0.224,0.225] };

  var CDN = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/";
  var MODEL_URL = "leaf_model.onnx";

  var SIZE, MEAN, INV_STD, N, CH, buf, tensor = null;
  var session = null, stream = null, running = false, busy = false;
  var frames = 0, t0 = 0, ROT = "auto", lastRot = 0;

  var $ = function (id) { return document.getElementById(id); };
  var video = $("video"), freeze = $("freeze"), thumb = $("thumb"),
      thumbCtx = thumb.getContext("2d"), bars = $("bars"), log = $("log");
  var crop = document.createElement("canvas"), cropCtx = null;

  function say(msg, cls) {
    log.innerHTML = cls ? '<span class="' + cls + '">' + msg + "</span>" : msg;
  }

  // Nothing should ever fail silently on a phone you can't attach a debugger to.
  window.addEventListener("error", function (e) {
    say("script error: " + (e.message || e.type) +
        (e.filename ? " @ " + String(e.filename).split("/").pop() + ":" + e.lineno : ""), "bad");
  });
  window.addEventListener("unhandledrejection", function (e) {
    say("unhandled: " + ((e.reason && e.reason.message) || e.reason), "bad");
  });

  function buildPreproc() {
    SIZE = CFG.input_size; CH = SIZE * SIZE;
    MEAN = CFG.mean; INV_STD = CFG.std.map(function (s) { return 1 / s; });
    buf = new Float32Array(3 * CH);
    crop.width = crop.height = SIZE;
    // alpha:false keeps getImageData() off the premultiply path; willReadFrequently
    // keeps the buffer CPU-side, which is what both Safari and Chrome want here.
    cropCtx = crop.getContext("2d", { alpha: false, willReadFrequently: true });
    $("modelTag").textContent = MODEL_URL + " · " + CFG.classes.join("/");
  }

  // A phone held portrait still hands getUserMedia a LANDSCAPE frame, so the leaf
  // arrives on its side. Rotate only in that case: portrait device + landscape
  // frame. If a given iOS version already delivers an upright (portrait) frame,
  // the second condition is false and we correctly leave it alone.
  // Overridable from the UI, because this is the one thing that can't be verified
  // off-device.
  function rotDeg(live, sw, sh) {
    if (!live) return 0;                       // stills are already EXIF-oriented
    if (ROT !== "auto") return +ROT;
    var portrait = window.matchMedia && window.matchMedia("(orientation: portrait)").matches;
    return (portrait && sw > sh) ? 90 : 0;
  }

  // Central square of the source, resampled straight into SIZE×SIZE.
  // Doing crop+resize as one drawImage() is what makes this identical to the
  // reference: scale the source rect, not an already-resized frame.
  function fillTensor(src, sw, sh, live) {
    var k = Math.min(sw, sh);
    var sx = Math.round((sw - k) / 2), sy = Math.round((sh - k) / 2);
    var deg = rotDeg(live, sw, sh) % 360;
    lastRot = deg;
    cropCtx.setTransform(1, 0, 0, 1, 0, 0);
    if (deg) {   // the crop is square, so 90/270 still fills the whole target
      cropCtx.translate(SIZE / 2, SIZE / 2);
      cropCtx.rotate(deg * Math.PI / 180);
      cropCtx.translate(-SIZE / 2, -SIZE / 2);
    }
    cropCtx.drawImage(src, sx, sy, k, k, 0, 0, SIZE, SIZE);
    cropCtx.setTransform(1, 0, 0, 1, 0, 0);
    var px = cropCtx.getImageData(0, 0, SIZE, SIZE).data;
    for (var i = 0; i < CH; i++) {
      var j = i << 2;
      buf[i]      = (px[j]     / 255 - MEAN[0]) * INV_STD[0];
      buf[CH + i] = (px[j + 1] / 255 - MEAN[1]) * INV_STD[1];
      buf[2*CH+i] = (px[j + 2] / 255 - MEAN[2]) * INV_STD[2];
    }
    thumbCtx.drawImage(crop, 0, 0);   // 96×96, shown scaled-up
    return buf;
  }

  function softmax(logits) {
    var m = -Infinity, i, s = 0, out = [];
    for (i = 0; i < logits.length; i++) if (logits[i] > m) m = logits[i];
    for (i = 0; i < logits.length; i++) { out[i] = Math.exp(logits[i] - m); s += out[i]; }
    for (i = 0; i < logits.length; i++) out[i] /= s;
    return out;
  }

  function fmt(p) {
    if (p >= 0.1)   return (p * 100).toFixed(1) + "%";
    if (p >= 0.001) return (p * 100).toFixed(3) + "%";
    if (p === 0)    return "0%";
    return (p * 100).toExponential(1) + "%";
  }

  // ---- UI ------------------------------------------------------------------
  var rows = [];
  function buildBars() {
    bars.innerHTML = ""; rows = [];
    CFG.classes.forEach(function (name) {
      var d = document.createElement("div"); d.className = "cls";
      d.innerHTML = '<div class="n"></div><div class="track"><div class="fill"></div></div><div class="p"></div>';
      d.querySelector(".n").textContent = name;
      bars.appendChild(d);
      rows.push({ name: name, el: d, fill: d.querySelector(".fill"), p: d.querySelector(".p") });
    });
  }

  function render(probs) {
    var best = 0, i;
    for (i = 1; i < probs.length; i++) if (probs[i] > probs[best]) best = i;
    for (i = 0; i < rows.length; i++) {
      rows[i].fill.style.width = Math.max(0.6, probs[i] * 100) + "%";
      rows[i].p.textContent = fmt(probs[i]);
      rows[i].el.classList.toggle("win", i === best);
    }
    $("top").textContent = CFG.classes[best];
  }

  function tick(live) {
    frames++;
    var ms = performance.now() - t0;
    if (ms > 500) { $("fps").textContent = (frames * 1000 / ms).toFixed(1) + " fps" +
          (live ? " · frame " + lastRot + "°" : ""); frames = 0; t0 = performance.now(); }
  }

  // ---- Inference -----------------------------------------------------------
  function classify(src, sw, sh, live) {
    fillTensor(src, sw, sh, live);
    if (!tensor) tensor = new ort.Tensor("float32", buf, [1, 3, SIZE, SIZE]);
    var feeds = {}; feeds[session.inputNames[0]] = tensor;
    return session.run(feeds).then(function (out) {
      var o = out[session.outputNames[0]];
      var probs = softmax(o.data);
      render(probs);
      return probs;
    });
  }

  function loop() {
    if (!running) return;
    if (busy || !video.videoWidth) { requestAnimationFrame(loop); return; }
    busy = true;
    classify(video, video.videoWidth, video.videoHeight, true)
      .then(function () { tick(true); }, function (e) {
      say("inference error: " + e.message, "bad");
    }).then(function () { busy = false; requestAnimationFrame(loop); });
  }

  // ---- Camera (iPhone Safari aware) ---------------------------------------
  function hasCamera() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  function open(back) {
    // Older iOS rejects unknown nested constraints, so degrade in steps.
    var tries = back
      ? [{ facingMode: { ideal: "environment" } }, { facingMode: "environment" }, { facingMode: "rear" }, true]
      : [true];
    var p = Promise.reject(new Error("no camera"));
    tries.forEach(function (c) {
      p = p.catch(function () {
        return navigator.mediaDevices.getUserMedia({ video: c, audio: false });
      });
    });
    return p;
  }

  function startCamera() {
    if (!hasCamera()) {
      say("getUserMedia unavailable. On iPhone this page must be served over HTTPS " +
          "(or localhost) — file:// and plain http:// will not offer the camera. " +
          "Use the Photo button meanwhile.", "bad");
      return;
    }
    stopCamera();
    say("requesting camera…");
    $("btnCam").disabled = true;
    open(true).then(function (s) {
      var track = s.getVideoTracks()[0];
      // Report which lens we actually got; getSettings() is missing on old iOS.
      var s2 = track && track.getSettings ? track.getSettings() : {};
      return s2.facingMode === "user" ? open(false).then(function (alt) { s = alt; return s; },
                                                        function () { return s; }) : s;
    }).then(function (s) {
      stream = s;
      video.srcObject = s;
      video.hidden = false; $("freeze").hidden = true;
      return video.play();
    }).then(function () {
      $("btnCam").disabled = false;
      $("btnCam").dataset.on = "1"; $("btnCam").textContent = "Stop camera";
      $("hint").hidden = true; $("stateDot").hidden = false;
      running = true; t0 = performance.now(); frames = 0;
      say("camera running");
      requestAnimationFrame(loop);
    }).catch(function (e) {
      $("btnCam").disabled = false;
      say("camera failed: " + (e && e.message || e) +
          " — check Settings ▸ Safari ▸ Camera, or use the Photo button.", "bad");
    });
  }

  function stopCamera() {
    running = false;
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
    $("btnCam").dataset.on = ""; $("btnCam").textContent = "Start camera";
    $("stateDot").hidden = true;
    $("fps").textContent = "";
  }

  // ---- Still images --------------------------------------------------------
  function loadImg(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () { res({ im: im, url: url }); };
      im.onerror = function () { URL.revokeObjectURL(url); rej(new Error("could not decode image")); };
      im.src = url;
    });
  }

  function fromFile(file) {
    if (!session) { say("model still loading — one moment.", "bad"); return; }
    stopCamera(); $("hint").hidden = true;
    loadImg(file).then(function (r) {
      return classify(r.im, r.im.naturalWidth, r.im.naturalHeight, false)
        .then(function () { return r; });
    }).then(function (r) {
      // Show the still in the same frame slot, sized like the video would be.
      freeze.width = 480; freeze.height = 480;
      freeze.getContext("2d").drawImage(r.im, 0, 0, 480, 480);
      freeze.hidden = false; video.hidden = true;
      URL.revokeObjectURL(r.url);
      say("classified: " + file.name, "ok");
    }).catch(function (e) { say("photo failed: " + e.message, "bad"); });
  }

  // ---- Self-test against check_expected.json -------------------------------
  function selfTest() {
    if (!session) { say("model still loading — try again in a second.", "bad"); return; }
    say("self-test: loading check_image.jpg …");
    var g = function (u) { return fetch(u, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(u + " → HTTP " + r.status); return r; }); };
    Promise.all([g("check_image.jpg").then(function (r) { return r.blob(); }),
                 g("check_expected.json").then(function (r) { return r.json(); })])
    .then(function (rs) {
      return new Promise(function (res, rej) {
        var url = URL.createObjectURL(rs[0]), im = new Image();
        im.onload = function () { res({ im: im, exp: rs[1], url: url }); };
        im.onerror = function () { URL.revokeObjectURL(url); rej(new Error("jpeg decode failed")); };
        im.src = url;
      });
    }).then(function (r) {
      return classify(r.im, r.im.naturalWidth, r.im.naturalHeight, false)
        .then(function (probs) {
        var max = 0, lines = [], missing = [];
        CFG.classes.forEach(function (c, i) {
          if (!(c in r.exp)) { missing.push(c); return; }
          var d = Math.abs(probs[i] - r.exp[c]);
          if (d > max) max = d;
          lines.push("  " + c.padEnd(9) + "here " + probs[i].toExponential(3).padStart(10) +
                     "   expected " + r.exp[c].toExponential(3).padStart(10) +
                     "   |d| " + d.toExponential(1));
        });
        var ok = max < 1e-3 && !missing.length;
        say((ok ? "PASS" : "FAIL") + " — max |diff| = " + max.toExponential(2) +
            (missing.length ? " (missing: " + missing.join(",") + ")" : "") +
            "\n" + lines.join("\n") +
            "\n  note: check_image.jpg is already " + r.im.naturalWidth + "×" + r.im.naturalHeight +
            ", so this verifies crop/normalise/layout/softmax; it does not exercise the resize.",
            ok ? "ok" : "bad");
        URL.revokeObjectURL(r.url);
      });
    }).catch(function (e) {
      say("self-test could not run: " + e.message +
          "\n  (needs the folder served over http(s); file:// blocks fetch)", "bad");
    });
  }

  // ---- Boot ----------------------------------------------------------------
  function loadModel() {
    say("loading model (6.3 MB)…");
    if (window.__ortLoadFailed || typeof ort === "undefined") {
      say("onnxruntime-web did not load from the CDN — check the network.", "bad"); return;
    }
    // Threads need cross-origin-isolation headers a plain static host won't send.
    // Guarded: these properties are not writable in every ort-web release, and
    // under "use strict" a read-only assignment would abort startup silently.
    try {
      ort.env.wasm.wasmPaths = CDN;
      ort.env.wasm.numThreads = 1;
      ort.env.wasm.proxy = false;
    } catch (e) { say("note: ort.env not configurable (" + e.message + ")"); }
    try { ort.env.logLevel = 3; } catch (e) { /* cosmetic only */ }
    fetch(MODEL_URL).then(function (r) {
      if (!r.ok) throw new Error(MODEL_URL + " → HTTP " + r.status);
      return r.arrayBuffer();
    }).then(function (ab) {
      return ort.InferenceSession.create(ab, { graphOptimizationLevel: "all",
                                               executionProviders: ["wasm"] });
    }).then(function (s) {
      session = s;
      var d = s.inputDims || (s.inputMetadata && s.inputMetadata[0] &&
                              s.inputMetadata[0].dimensions);
      say("ready — input " + s.inputNames[0] + " " +
          (d ? JSON.stringify(d) : "[1,3," + SIZE + "," + SIZE + "]") +
          ", output " + s.outputNames[0] + " (softmax applied here)", "ok");
    }).catch(function (e) { say("model load failed: " + (e && e.message || e), "bad"); });
  }

  function boot() {
    fetch("model_info.json", { cache: "no-store" }).then(function (r) {
      return r.ok ? r.json() : CFG;
    }).catch(function () { return CFG; }).then(function (c) {
      if (c && c.input_size && c.classes) CFG = c;
      buildPreproc(); buildBars(); loadModel();
    });
    $("btnCam").addEventListener("click", function () {
      running ? stopCamera() : startCamera();
    });
    $("btnCheck").addEventListener("click", selfTest);
    var ORDERS = ["auto", "0", "90", "180", "270"];
    try { if (ORDERS.indexOf(localStorage.getItem("leafRot")) >= 0) ROT = localStorage.getItem("leafRot"); }
    catch (e) { /* private mode: nothing to persist to */ }
    function labelRot() {
      $("btnRot").textContent = "Frame: " + (ROT === "auto" ? "auto" : ROT + "°");
    }
    $("btnRot").addEventListener("click", function () {
      ROT = ORDERS[(ORDERS.indexOf(ROT) + 1) % ORDERS.length];
      labelRot();
      try { localStorage.setItem("leafRot", ROT); } catch (e) {}
    });
    labelRot();
    $("file").addEventListener("change", function (e) {
      if (e.target.files && e.target.files[0]) fromFile(e.target.files[0]);
    });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) stopCamera();   // iOS frees the camera lazily; don't fight it
    });
  }
  boot();
})();
</script>
</body>
</html>
